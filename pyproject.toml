[project]
name = "tinyvllm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "57ajay", email = "57ajay.u@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tinyvllm = "tinyvllm:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
